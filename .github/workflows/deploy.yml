# Publică automat aplicația pe GitHub Pages la fiecare push pe ramura main.
name: Publicare pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Zilnic la ~07:17 (ora Chișinăului): reîmprospătează ofertele și magazinele Nr1.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Oferte, broșuri, rețete și magazine de pe nr1.md (dacă site-ul nu răspunde, se păstrează versiunea anterioară)
      - run: node scripts/fetch-nr1.mjs
      - run: npm run build
        env:
          # Site-ul e servit din subfolderul /<nume-repository>
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
